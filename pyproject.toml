[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twake-flutter-migration-agent"
version = "2.0.0"
description = "Manifest-gated Twake React to Flutter migration toolkit"
requires-python = ">=3.11"
dependencies = ["tree-sitter>=0.25,<0.27", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-javascript>=0.25,<0.26", "Pillow>=11,<14", "playwright>=1.50,<2", "jsonschema>=4.23,<5", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
twake-migrate = "twake_migrate.cli:main"

[tool.setuptools]
packages = [
  "twake_migrate",
  "twake_migrate.config",
  "twake_migrate.core",
  "twake_migrate.browser",
  "twake_migrate.agent",
  "twake_migrate.agent.tools",
  "twake_migrate.parsers",
  "twake_migrate.exporters",
]

[tool.setuptools.package-data]
twake_migrate = ["templates/*", "schemas/*.json", "assets/*", "agent_rules.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
